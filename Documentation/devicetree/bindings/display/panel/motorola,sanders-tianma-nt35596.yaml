%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/motorola,sanders-tianma-nt35596.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Motorola Moto G5S Plus Tianma NT35596 DSI Display Panel

maintainers:
  - tigelaa <tigelaa@proton.me>

description:
  1080x1920 video mode DSI panel with a Tianma NT35596 controller,
  as used in the Motorola Moto G5S Plus (sanders).

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - const: motorola,sanders-tianma-nt35596

  reg:
    maxItems: 1

  vsn-supply:
    description: Regulator for negative display supply.

  vsp-supply:
    description: Regulator for positive display supply.

  backlight: true
  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - vsn-supply
  - vsp-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "motorola,sanders-tianma-nt35596";
            reg = <0>;

            reset-gpios = <&tlmm 61 GPIO_ACTIVE_LOW>;

            vsn-supply = <&ibb>;
            vsp-supply = <&lab>;

            backlight = <&pmi8950_wled>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };
